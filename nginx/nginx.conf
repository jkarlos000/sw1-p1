events {
    worker_connections 1024;
}

http {
    # Configuración básica
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Optimización
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    # Upstream para Backend
    upstream backend_upstream {
        server backend:3000;
    }

    # Upstream para Frontend
    upstream frontend_upstream {
        server frontend:80;
    }

    # Redirigir HTTP a HTTPS
    server {
        listen 80;
        server_name uml.jkhoster.com;
        
        # Health check endpoint (permitir sin SSL)
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        # Redirigir todo lo demás a HTTPS
        # TEMPORAL: No redirigir a HTTPS hasta obtener certificados
        # location / {
        #     return 301 https://$server_name$request_uri;
        # }
        
        # Servir frontend temporalmente por HTTP
        location / {
            proxy_pass http://frontend:80/;
            proxy_set_header Host $host;
        }
        
        # API temporalmente por HTTP
        location /api/ {
            proxy_pass http://backend:3000/;
            proxy_set_header Host $host;
        }
    }

    # Servidor HTTPS Principal (COMENTADO - descomentar después de obtener certificados)
    # server {
    #     listen 443 ssl http2;
    #     server_name uml.jkhoster.com;
    #     ... (resto comentado)
    # }
}
